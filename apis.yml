name: Austal

description: Austal is an Australian shipbuilder and defence prime contractor, founded in Henderson, Western Australia in 1988 and listed on the Australian Stock Exchange since December 1998. It designs, builds and sustains customised commercial and defence vessels, including ferries and naval ships, from shipyards in Western Australia, the United States, Vietnam and the Philippines, having delivered more than 350 vessels for 122 operators in 59 countries. It also offers vessel sustainment, training and consultancy, autonomy, advanced manufacturing and platform systems. Its public website publishes no developer API, documentation or developer portal.

